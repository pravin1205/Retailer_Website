version: "3.9"

# Infrastructure only — PostgreSQL, Redis, Kafka
# Use this during development when running Java services locally:
#   docker compose -f docker-compose.infra.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketly-postgres
    environment:
      POSTGRES_DB: marketly
      POSTGRES_USER: marketly
      POSTGRES_PASSWORD: marketly_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketly"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marketly-net

  redis:
    image: redis:7-alpine
    container_name: marketly-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - marketly-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: marketly-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # Use Zookeeper's own status script — nc is not available in this image
      test: ["CMD", "/bin/bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null; exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - marketly-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: marketly-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - marketly-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: marketly-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - marketly-net

networks:
  marketly-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
