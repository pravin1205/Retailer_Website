version: "3.9"

# Full stack: infrastructure + all 8 microservices + observability
# Usage:                   docker compose up -d
# Infrastructure only:     docker compose -f docker-compose.infra.yml up -d
# Build a single service:  docker compose build identity-service

services:

  # ══════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: marketly-postgres
    environment:
      POSTGRES_DB: marketly
      POSTGRES_USER: marketly
      POSTGRES_PASSWORD: marketly_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketly"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marketly-net

  redis:
    image: redis:7-alpine
    container_name: marketly-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - marketly-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: marketly-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketly-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: marketly-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - marketly-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: marketly-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - marketly-net

  # ── Observability ─────────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin:3
    container_name: marketly-zipkin
    ports:
      - "9411:9411"
    networks:
      - marketly-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: marketly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - marketly-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: marketly-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - marketly-net

  # ══════════════════════════════════════════════════════════════════
  # MICROSERVICES
  # All services build from the backend root (context: .)
  # using the single Dockerfile with SERVICE_NAME build-arg.
  # ══════════════════════════════════════════════════════════════════

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: identity-service
    image: marketly/identity-service:latest
    container_name: marketly-identity-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-this-in-production-min-256-bits-!!}
      TENANT_SERVICE_URL: http://tenant-service:8082
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tenant-service
    image: marketly/tenant-service:latest
    container_name: marketly-tenant-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
    image: marketly/product-service:latest
    container_name: marketly-product-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: customer-service
    image: marketly/customer-service:latest
    container_name: marketly-customer-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    image: marketly/order-service:latest
    container_name: marketly-order-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    image: marketly/notification-service:latest
    container_name: marketly-notification-service
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: analytics-service
    image: marketly/analytics-service:latest
    container_name: marketly-analytics-service
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marketly
      DB_USERNAME: marketly
      DB_PASSWORD: marketly_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    image: marketly/api-gateway:latest
    container_name: marketly-api-gateway
    ports:
      - "8080:8080"  # api-gateway listens on host port 8080
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://identity-service:8081/eureka
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-this-in-production-min-256-bits-!!}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-marketly.com}
      TENANT_SERVICE_URL: http://tenant-service:8082
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      identity-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  # ── WhatsApp Service ─────────────────────────────────────────────────────
  whatsapp-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: whatsapp-service
    image: marketly/whatsapp-service:latest
    container_name: marketly-whatsapp-service
    ports:
      - "8088:8088"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IDENTITY_SERVICE_URL:  http://identity-service:8081
      TENANT_SERVICE_URL:    http://tenant-service:8082
      PRODUCT_SERVICE_URL:   http://product-service:8083
      CUSTOMER_SERVICE_URL:  http://customer-service:8084
      ORDER_SERVICE_URL:     http://order-service:8085
      META_WEBHOOK_VERIFY_TOKEN:     ${META_WEBHOOK_VERIFY_TOKEN:-dev-verify-token}
      META_APP_SECRET:               ${META_APP_SECRET:-}
      GROQ_API_KEY:                  ${GROQ_API_KEY:-}
      OPENAI_API_KEY:                ${OPENAI_API_KEY:-}
      HUGGINGFACE_API_KEY:           ${HUGGINGFACE_API_KEY:-}
      RAZORPAY_KEY_ID:               ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET:           ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET:       ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:-dev-32-char-encryption-key-here!!}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - marketly-net

  # ── Frontend (TanStack Start / Node.js SSR) ───────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: marketly/frontend:latest
    container_name: marketly-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # The SSR server forwards /api/v1/* to the api-gateway inside the Docker network
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 | grep -q marketly || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - marketly-net

# ══════════════════════════════════════════════════════════════════
# VOLUMES & NETWORKS
# ══════════════════════════════════════════════════════════════════

networks:
  marketly-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  grafana-data:
