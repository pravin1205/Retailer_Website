server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      # Direct localhost routes for local terminal-based development
      routes:

        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: tenant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/tenants/**

        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**

        - id: customer-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/customers/**

        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/coupons/**

        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**

        - id: analytics-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/analytics/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.marketly.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-this-in-production-min-256-bits-!!}
  platform-domain:    ${PLATFORM_DOMAIN:marketly.com}
  tenant-service-url: ${TENANT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    com.marketly: INFO
    org.springframework.cloud.gateway: WARN
